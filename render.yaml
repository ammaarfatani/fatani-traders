services:
  - type: web
    name: fatani-traders-backend
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm run build:shared && pnpm run build:backend
    startCommand: node apps/backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
